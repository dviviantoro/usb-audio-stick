; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Four environments, four src/main_*.cpp files, same board:
;   esp32-s3-udp          -> src/main_udp.cpp             (WiFi/UDP mic+speaker -- proven working)
;   esp32-s3-usb           -> src/main_usb.cpp              (native USB Audio mic+speaker + CDC debug port)
;   esp32-s3-usb-bisect   -> src/main_usb_bisect.cpp       (diagnostic: mic-only USB Audio, no speaker/CDC -- proven working)
;   esp32-s3-usb-rxtx-nocdc -> src/main_usb_rxtx_nocdc.cpp (diagnostic: mic+speaker USB Audio, no CDC)
; Build/upload a specific one with `pio run -e <name> -t upload`.

[platformio]
; default_envs = esp32-s3-usb-rxtx-nocdc
default_envs = esp32-s3-usb
; default_envs = esp32-s3-udp
; default_envs = esp32-s3-usb-bisect

[env]
platform = espressif32
; The physical chip identifies itself (via esptool flash_id) as an
; ESP32-S3 with 4MB embedded flash + 2MB embedded PSRAM, not the 8MB/no-PSRAM
; variant "esp32-s3-devkitc-1" assumes. That mismatch built an 8MB partition
; table that didn't fit the real 4MB flash, so the bootloader rejected it and
; the chip boot-looped before any application code (USB or WiFi) ever ran.
board = esp32-s3-devkitc1-n4r2
framework = arduino
monitor_speed = 115200
; The board profile references "default_4MB.csv", which doesn't exist in
; this framework package version -- use the equivalent standard 4MB table.
board_build.partitions = default.csv
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git

[env:esp32-s3-udp]
build_src_filter = +<*> -<main_usb.cpp> -<main_usb_bisect.cpp> -<main_usb_rxtx_nocdc.cpp>
; This board profile leaves ARDUINO_USB_MODE/ARDUINO_USB_CDC_ON_BOOT
; undefined, which means the core's global "Serial" object falls back to
; the physical UART pins instead of the USB port -- so nothing shows up on
; the same USB cable used for flashing/monitoring. Explicitly select native
; USB-CDC-on-boot so Serial output goes out over USB. Audio itself streams
; over WiFi/UDP, so no other USB flags are needed.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-usb]
build_src_filter = +<*> -<main_udp.cpp> -<main_usb_bisect.cpp> -<main_usb_rxtx_nocdc.cpp>
; Native USB-OTG mode, CDC-on-boot disabled (USBAudioStream on ESP32
; requires this -- it #errors at compile time otherwise). main_usb.cpp adds
; its own composite USBCDC object for debug logging since the default
; Serial won't route over USB under these settings.
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=2
; Stop PlatformIO from stripping out the USB interrupt callbacks.
lib_archive = no

[env:esp32-s3-usb-bisect]
build_src_filter = +<*> -<main_udp.cpp> -<main_usb.cpp> -<main_usb_rxtx_nocdc.cpp>
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=2
lib_archive = no

[env:esp32-s3-usb-rxtx-nocdc]
build_src_filter = +<*> -<main_udp.cpp> -<main_usb.cpp> -<main_usb_bisect.cpp>
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=2
lib_archive = no
